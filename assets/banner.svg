<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">python-skills</title>
  <desc id="d">Agent skills that turn loose Python into typed, explicit, reliable code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8bbe"/>
      <stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="snake2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>

  <!-- Python mark -->
  <g transform="translate(64 64)">
    <path d="M38 0c-19 0-18 8-18 8v9h19v3H12S0 18 0 38s11 19 11 19h6v-9s0-11 11-11h19s10 0 10-10V10S59 0 38 0zm-11 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="url(#snake)"/>
    <path d="M38 76c19 0 18-8 18-8v-9H37v-3h27s12 2 12-18-11-19-11-19h-6v9s0 11-11 11H29s-10 0-10 10v17s-2 10 19 10zm11-6a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="url(#snake2)"/>
  </g>

  <text x="64" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f1f5f9">python-skills</text>
  <text x="64" y="250" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Agent skills for Python that reads clearly</text>
  <text x="64" y="280" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">and survives production.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">
    <rect x="64" y="312" width="140" height="36" rx="18" fill="#306998" fill-opacity="0.35" stroke="#4b8bbe"/>
    <text x="134" y="336" text-anchor="middle" fill="#cfe3f5">python-dev</text>
    <rect x="216" y="312" width="180" height="36" rx="18" fill="#ffd43b" fill-opacity="0.15" stroke="#ffd43b"/>
    <text x="306" y="336" text-anchor="middle" fill="#ffe9a3">python-refactor</text>
  </g>

  <!-- Code card -->
  <g transform="translate(560 48)">
    <rect width="576" height="304" rx="14" fill="#0b1220" stroke="#334155"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#22c55e"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="24" y="66" fill="#f87171">-</text><text x="48" y="66" fill="#f87171">def get_user(id, cache={}):</text>
      <text x="24" y="90" fill="#f87171">-</text><text x="86" y="90" fill="#f87171">try: ... requests.get(url)</text>
      <text x="24" y="114" fill="#f87171">-</text><text x="86" y="114" fill="#f87171">except Exception: return None</text>
      <line x1="24" y1="134" x2="552" y2="134" stroke="#334155" stroke-dasharray="4 6"/>
      <text x="24" y="162" fill="#4ade80">+</text><text x="48" y="162" fill="#4ade80">def fetch_user(</text>
      <text x="24" y="186" fill="#4ade80">+</text><text x="86" y="186" fill="#4ade80">client: httpx.Client, user_id: int,</text>
      <text x="24" y="210" fill="#4ade80">+</text><text x="48" y="210" fill="#4ade80">) -&gt; User:</text>
      <text x="24" y="234" fill="#4ade80">+</text><text x="86" y="234" fill="#4ade80">response = client.get(..., timeout=5.0)</text>
      <text x="24" y="258" fill="#4ade80">+</text><text x="86" y="258" fill="#4ade80">if response.status_code == 404:</text>
      <text x="24" y="282" fill="#4ade80">+</text><text x="124" y="282" fill="#4ade80">raise UserNotFound(user_id)</text>
    </g>
  </g>
</svg>
