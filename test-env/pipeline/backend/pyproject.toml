[project]
name = "mlpipe"
version = "0.1.0"
description = "Kafka fan-out/fan-in console for a multi-algorithm ML pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.11,<0.13",
  "asyncpg>=0.29,<0.31",
  "fastapi>=0.115,<0.118",
  "prometheus-client>=0.21,<0.22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.1,<7",
  "uvicorn[standard]>=0.32,<0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpipe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PIE", "PT", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/mlpipe"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "asyncpg.*"]
ignore_missing_imports = true
